name: givetrack   # 顶层 name 字段兜底，避免中文目录名导致 project name 为空

services:
  db:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME:-givetrack}-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "${DB_PORT:-33335}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-givetrack}-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3235}:8080"
    environment:
      APP_ENV: production
      SERVER_PORT: 8080
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8235}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-givetrack}-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8235}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
